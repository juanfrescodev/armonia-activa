<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio - Armonía Activa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        /* Mejoras estéticas al piano */
        .tecla-blanca { 
            flex: 1; 
            background: linear-gradient(to bottom, #fff 0%, #f1f5f9 100%); 
            border: 1px solid #cbd5e1; 
            border-top: none;
            border-radius: 0 0 8px 8px; 
            position: relative; 
            z-index: 1; 
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 15px;
            color: #94a3b8;
            font-weight: bold;
            font-size: 0.75rem;
            transition: background 0.1s;
        }
        .tecla-negra { 
            position: absolute; 
            background: linear-gradient(to bottom, #1e293b 0%, #020617 100%); 
            width: 65%; 
            height: 60%; 
            left: 67.5%; 
            border-radius: 0 0 6px 6px; 
            z-index: 2; 
            box-shadow: inset 0 -2px 3px rgba(255,255,255,0.2), 2px 3px 5px rgba(0,0,0,0.5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            color: #64748b;
            font-weight: bold;
            font-size: 0.6rem;
            transition: background 0.1s;
        }
        .blanca-activa { background: #c7d2fe !important; box-shadow: inset 0 2px 5px rgba(0,0,0,0.2) !important; } 
        .negra-activa { background: #4f46e5 !important; }
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-[#0a0f1c] to-black text-slate-100 min-h-[100dvh] flex flex-col font-sans pb-20">

    <header class="p-4 text-center backdrop-blur-md border-b border-white/5">
        <h1 class="text-xl font-bold tracking-tight text-slate-200">Laboratorio Libre</h1>
    </header>

    <main class="max-w-4xl mx-auto w-full p-6 flex-grow flex flex-col justify-center">
        
        <!-- Navegación interna de pestañas -->
        <div class="flex gap-2 mb-6">
            <button onclick="cambiarTab('piano')" id="btn-tab-piano" class="flex-1 py-2 bg-indigo-600 rounded-lg font-bold transition-colors">Piano</button>
            <button onclick="cambiarTab('sandbox')" id="btn-tab-sandbox" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg font-bold transition-colors">Sandbox Emocional</button>
        </div>

        <!-- VISTA 1: PIANO -->
        <div id="piano-view" class="space-y-4">
            <div class="bg-indigo-500/10 border border-indigo-500/20 rounded-2xl p-4 text-center backdrop-blur-sm">
                <p class="text-indigo-200 text-sm">
                    <span class="text-xl block mb-2">🎹</span>
                    Usa el <strong>teclado de tu PC</strong> (fila A-S-D-F) o toca la pantalla.
                </p>
            </div>
            <div class="w-full h-56 flex relative select-none rounded-t-xl overflow-hidden shadow-[0_10px_30px_rgba(0,0,0,0.5)] border-t border-x border-slate-700 bg-slate-900 p-1" id="piano-lab"></div>
        </div>

        <!-- VISTA 2: SANDBOX EMOCIONAL -->
        <div id="sandbox-view" class="hidden space-y-4">
            <div class="p-6 bg-slate-800 rounded-2xl border border-indigo-500/30">
                <h3 class="font-bold text-indigo-300 mb-4 text-center">¿Qué quieres sentir?</h3>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="tocarEmocion('alegria')" class="p-4 bg-slate-700 rounded-xl hover:bg-amber-500 hover:text-white transition-all font-bold text-lg active:scale-95 shadow-lg">Alegría ☀️</button>
                    <button onclick="tocarEmocion('nostalgia')" class="p-4 bg-slate-700 rounded-xl hover:bg-blue-500 hover:text-white transition-all font-bold text-lg active:scale-95 shadow-lg">Nostalgia 🌧️</button>
                </div>
            </div>
            
            <div id="progreso-sugerido" class="p-6 bg-slate-900/80 border border-slate-700 rounded-xl text-center min-h-[100px] flex flex-col justify-center">
                <p class="text-sm text-slate-400">Selecciona una emoción para ver su armonía...</p>
            </div>
        </div>

    </main>

    <!-- MENÚ INFERIOR (LAB ACTIVO) -->
    <nav class="fixed bottom-0 w-full max-w-md left-1/2 -translate-x-1/2 bg-[#0a0f1c]/90 backdrop-blur-lg border-t border-white/5 flex justify-around pb-6 pt-4 px-2 z-20">
        <a href="index.html" class="flex flex-col items-center gap-1.5 text-slate-500 hover:text-slate-300 w-20 transition-colors">
            <span class="text-2xl opacity-70 hover:opacity-100 transition-opacity">🗺️</span>
            <span class="text-[10px] font-bold uppercase tracking-widest">Ruta</span>
        </a>
        <a href="lab.html" class="flex flex-col items-center gap-1.5 text-indigo-400 w-20">
            <span class="text-2xl drop-shadow-[0_0_8px_rgba(99,102,241,0.5)]">🎹</span>
            <span class="text-[10px] font-bold uppercase tracking-widest">Lab</span>
        </a>
        <a href="perfil.html" class="flex flex-col items-center gap-1.5 text-slate-500 hover:text-slate-300 w-20 transition-colors">
            <span class="text-2xl opacity-70 hover:opacity-100 transition-opacity">👤</span>
            <span class="text-[10px] font-bold uppercase tracking-widest">Perfil</span>
        </a>
    </nav>

    <!-- BASE DE DATOS Y LÓGICA -->
    <script src="lecciones.js"></script>
    <script>
        // --- INICIALIZACIÓN DE TONE.JS ---
        const synth = new Tone.PolySynth(Tone.Synth).toDestination();
        synth.set({ oscillator: { type: "triangle" }, envelope: { release: 1.5 } });
        
        // --- CONSTRUCCIÓN DEL PIANO VISUAL ---
        const notasPiano = [
            { id: "C4", b: true, teclaPc: 'a' }, { id: "C#4", b: false, teclaPc: 'w' }, 
            { id: "D4", b: true, teclaPc: 's' }, { id: "D#4", b: false, teclaPc: 'e' }, 
            { id: "E4", b: true, teclaPc: 'd' }, { id: "F4", b: true, teclaPc: 'f' }, 
            { id: "F#4", b: false, teclaPc: 't' }, { id: "G4", b: true, teclaPc: 'g' }, 
            { id: "G#4", b: false, teclaPc: 'y' }, { id: "A4", b: true, teclaPc: 'h' }, 
            { id: "A#4", b: false, teclaPc: 'u' }, { id: "B4", b: true, teclaPc: 'j' }, 
            { id: "C5", b: true, teclaPc: 'k' }
        ];

        const contenedor = document.getElementById('piano-lab');
        const elementosDOM = {}; 

        notasPiano.forEach((nota, index) => {
            const div = document.createElement('div');
            
            if (nota.b) {
                div.className = 'tecla-blanca';
                div.innerText = nota.teclaPc.toUpperCase(); 
                
                const sig = notasPiano[index + 1];
                if (sig && !sig.b) {
                    const negra = document.createElement('div');
                    negra.className = 'tecla-negra';
                    negra.innerText = sig.teclaPc.toUpperCase(); 
                    
                    negra.onpointerdown = async (e) => { e.stopPropagation(); tocar(sig.id); iluminarTecla(sig.id); };
                    negra.onpointerup = (e) => { e.stopPropagation(); soltar(sig.id); apagarTecla(sig.id); };
                    negra.onpointerleave = (e) => { e.stopPropagation(); soltar(sig.id); apagarTecla(sig.id); };
                    
                    elementosDOM[sig.id] = { el: negra, esBlanca: false };
                    div.appendChild(negra);
                }
                
                div.onpointerdown = async () => { tocar(nota.id); iluminarTecla(nota.id); };
                div.onpointerup = () => { soltar(nota.id); apagarTecla(nota.id); };
                div.onpointerleave = () => { soltar(nota.id); apagarTecla(nota.id); };
                
                elementosDOM[nota.id] = { el: div, esBlanca: true };
                contenedor.appendChild(div);
            }
        });

        // --- LÓGICA DE SONIDO DEL PIANO ---
        const teclasPresionadas = new Set();

        async function tocar(nota) {
            await Tone.start();
            synth.triggerAttack(nota);
        }

        function soltar(nota) {
            synth.triggerRelease(nota);
        }

        function iluminarTecla(nota) {
            const data = elementosDOM[nota];
            if(data) data.el.classList.add(data.esBlanca ? 'blanca-activa' : 'negra-activa');
        }

        function apagarTecla(nota) {
            const data = elementosDOM[nota];
            if(data) data.el.classList.remove('blanca-activa', 'negra-activa');
        }

        // --- EVENTOS DEL TECLADO DE LA PC ---
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return; 
            const tecla = e.key.toLowerCase();
            const notaEncontrada = notasPiano.find(n => n.teclaPc === tecla);
            
            if (notaEncontrada && !teclasPresionadas.has(tecla)) {
                teclasPresionadas.add(tecla);
                tocar(notaEncontrada.id);
                iluminarTecla(notaEncontrada.id);
            }
        });

        window.addEventListener('keyup', (e) => {
            const tecla = e.key.toLowerCase();
            const notaEncontrada = notasPiano.find(n => n.teclaPc === tecla);
            
            if (notaEncontrada) {
                teclasPresionadas.delete(tecla);
                soltar(notaEncontrada.id);
                apagarTecla(notaEncontrada.id);
            }
        });

        // --- LÓGICA DE PESTAÑAS (TABS) ---
        function cambiarTab(tab) {
            const pianoView = document.getElementById('piano-view');
            const sandboxView = document.getElementById('sandbox-view');
            const btnPiano = document.getElementById('btn-tab-piano');
            const btnSandbox = document.getElementById('btn-tab-sandbox');

            if(tab === 'piano') {
                pianoView.classList.remove('hidden');
                sandboxView.classList.add('hidden');
                btnPiano.classList.replace('bg-slate-800', 'bg-indigo-600');
                btnSandbox.classList.replace('bg-indigo-600', 'bg-slate-800');
            } else {
                pianoView.classList.add('hidden');
                sandboxView.classList.remove('hidden');
                btnSandbox.classList.replace('bg-slate-800', 'bg-indigo-600');
                btnPiano.classList.replace('bg-indigo-600', 'bg-slate-800');
            }
        }

        // --- LÓGICA DEL SANDBOX EMOCIONAL ---
        async function tocarEmocion(tipo) {
            await Tone.start();
            // Leemos de EMOCIONES que definimos en lecciones.js
            const data = EMOCIONES[tipo]; 
            
            // 1. Mostrar qué está pasando en la pantalla
            document.getElementById('progreso-sugerido').innerHTML = `
                <h4 class="text-2xl mb-2">${tipo === 'alegria' ? '☀️' : '🌧️'}</h4>
                <h4 class="font-bold text-lg text-indigo-300">${data.nombre}</h4>
                <p class="text-sm text-slate-300 mt-2 bg-slate-800/50 p-2 rounded">${data.desc}</p>
                <p class="text-xs text-indigo-400 mt-3 font-mono tracking-widest">NOTAS: ${data.progresion.join(' - ')}</p>
            `;

            // 2. Reproducir el acorde
            const ahora = Tone.now();
            synth.triggerAttackRelease(data.progresion, "2n", ahora);
            
            // 3. Iluminar "en fantasma" las teclas del piano (aunque esté oculta la pestaña)
            data.progresion.forEach((nota, index) => {
                setTimeout(() => {
                    iluminarTecla(nota);
                    setTimeout(() => apagarTecla(nota), 800);
                }, index * 100);
            });
        }
    </script>
</body>
</html>

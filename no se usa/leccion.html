

//leccion.html

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lección - Armonía Activa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="lecciones.js"></script>
    <style>
        .tecla-activa { background: #6366f1 !important; border-color: #4f46e5 !important; }
        .tecla { transition: background 0.1s; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

    <!-- Piano Visual -->
    <div id="piano-visual" class="max-w-md mx-auto h-20 flex mb-8 rounded-xl overflow-hidden border border-slate-700 bg-black shadow-2xl"></div>

    <div id="contenedor-leccion" class="max-w-md mx-auto space-y-6">
        <h1 id="titulo" class="text-3xl font-bold text-indigo-400">Cargando...</h1>
        <div id="contenido" class="bg-slate-800 p-6 rounded-2xl"></div>
        <div id="acciones" class="space-y-4"></div>
        <a href="index.html" class="block text-center text-slate-500 underline">Volver al mapa</a>
    </div>

    <script>
        const synth = new Tone.PolySynth(Tone.Synth).toDestination();
        const idLeccion = new URLSearchParams(window.location.search).get('id');
        console.log("ID de lección actual:", idLeccion);
        const leccion = DB_LECCIONES.mundo_1.lecciones.find(l => l.id === idLeccion);

        // 1. Generar Piano Visual
        const pianoEl = document.getElementById('piano-visual');
        ["C4", "C#4", "D4", "D#4", "E4", "F4", "F#4", "G4", "G#4", "A4", "A#4", "B4", "C5"].forEach(n => {
            const d = document.createElement('div');
            d.className = `tecla flex-1 border-r border-slate-800 ${n.includes('#') ? 'bg-slate-900' : 'bg-white'}`;
            d.id = "key-" + n.replace('#', 's');
            pianoEl.appendChild(d);
        });

        async function tocar(notas) {
            await Tone.start();
            synth.triggerAttackRelease(notas, "2n");
            notas.forEach(n => {
                const el = document.getElementById("key-" + n.replace('#', 's'));
                if (el) { el.classList.add('tecla-activa'); setTimeout(() => el.classList.remove('tecla-activa'), 800); }
            });
        }

        // 2. Renderizar contenido
        document.getElementById('titulo').innerText = leccion.titulo;
        const cont = document.getElementById('contenido');
        const acc = document.getElementById('acciones');

            // Dentro del window.onload, en el bloque de 'teoria':
            if (leccion.tipo === 'teoria') {
                cont.innerHTML = leccion.teoria;
                acc.innerHTML = `
                    <button onclick="tocar(['${leccion.notas.join("','")}'])" class="w-full py-4 bg-indigo-600 rounded-xl font-bold">🔊 Escuchar</button>
                    <button onclick="marcarCompletada()" class="w-full py-4 bg-emerald-600 rounded-xl font-bold">✅ He terminado</button>
                `;
            } else {
            cont.innerHTML = leccion.reto;
            acc.innerHTML = `
                <button onclick="tocar(['${leccion.comparacion.opcionA.notas.join("','")}'])" class="w-full p-3 bg-slate-700 rounded-lg hover:bg-slate-600">A: ${leccion.comparacion.opcionA.nombre}</button>
                <button onclick="tocar(['${leccion.comparacion.opcionB.notas.join("','")}'])" class="w-full p-3 bg-slate-700 rounded-lg hover:bg-slate-600">B: ${leccion.comparacion.opcionB.nombre}</button>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="verificar('A')" class="py-4 bg-slate-700 rounded-xl font-bold">Elegir A</button>
                    <button onclick="verificar('B')" class="py-4 bg-slate-700 rounded-xl font-bold">Elegir B</button>
                </div>
            `;
        }

            function verificar(sel) {
                console.log("Se eligió:", sel);
                if (sel === 'B') {
                    let comp = JSON.parse(localStorage.getItem('leccionesCompletadas') || '[]');
                    console.log("Antes de guardar:", comp);
                    
                    if (!comp.includes(idLeccion)) {
                        comp.push(idLeccion);
                        localStorage.setItem('leccionesCompletadas', JSON.stringify(comp));
                        console.log("Guardado. Nuevo valor:", localStorage.getItem('leccionesCompletadas'));
                    }
                    
                    window.location.href = "index.html";
                } else {
                    alert("Incorrecto.");
                }
                
            }

            function marcarCompletada() {
                let comp = JSON.parse(localStorage.getItem('leccionesCompletadas') || '[]');
                if (!comp.includes(idLeccion)) {
                    comp.push(idLeccion);
                    localStorage.setItem('leccionesCompletadas', JSON.stringify(comp));
                }
                window.location.href = "index.html";
            }
    </script>
</body>
</html>

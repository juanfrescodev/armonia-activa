<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
    Lab · Armonía Activa
</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>


<style>

/* =========================================================
   ARMONÍA ACTIVA — LABORATORIO
   ========================================================= */

:root {

    --lab-bg:
        #050816;

    --lab-panel:
        rgba(15, 23, 42, 0.72);

    --lab-border:
        rgba(255,255,255,0.08);

    --lab-accent:
        #818cf8;

    --lab-accent-light:
        #c7d2fe;

    --lab-text:
        #f8fafc;

    --lab-muted:
        #94a3b8;

}


/* =========================================================
   BASE
   ========================================================= */

* {

    box-sizing:
        border-box;

}


html {

    min-height:
        100%;

}


body {

    margin:
        0;

    min-height:
        100vh;

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(99,102,241,0.18),
            transparent 40%
        ),

        radial-gradient(
            circle at 0% 50%,
            rgba(139,92,246,0.08),
            transparent 35%
        ),

        linear-gradient(
            180deg,
            #080c19,
            #050816 60%,
            #020308
        );

    color:
        var(--lab-text);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    padding-bottom:
        110px;

}


/* =========================================================
   FONDO
   ========================================================= */

.ambient {

    position:
        fixed;

    pointer-events:
        none;

    border-radius:
        50%;

    filter:
        blur(80px);

    opacity:
        0.18;

    z-index:
        0;

}


.ambient-one {

    width:
        280px;

    height:
        280px;

    top:
        80px;

    left:
        -120px;

    background:
        #6366f1;

}


.ambient-two {

    width:
        240px;

    height:
        240px;

    right:
        -100px;

    top:
        45%;

    background:
        #8b5cf6;

}


/* =========================================================
   CONTENEDOR
   ========================================================= */

.app {

    position:
        relative;

    z-index:
        1;

    width:
        100%;

    max-width:
        1000px;

    margin:
        0 auto;

    padding:
        40px 24px 30px;

}


/* =========================================================
   ANIMACIÓN
   ========================================================= */

.aparecer {

    animation:
        aparecer
        350ms
        ease-out;

}


@keyframes aparecer {

    from {

        opacity:
            0;

        transform:
            translateY(10px);

    }

    to {

        opacity:
            1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   HEADER
   ========================================================= */

.lab-header {

    text-align:
        center;

    margin:
        10px auto 34px;

    max-width:
        720px;

}


.lab-label {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        8px;

    padding:
        7px 12px;

    margin-bottom:
        16px;

    border:
        1px solid
        rgba(129,140,248,0.16);

    border-radius:
        999px;

    background:
        rgba(99,102,241,0.08);

    color:
        #a5b4fc;

    font-size:
        11px;

    font-weight:
        700;

    letter-spacing:
        0.14em;

    text-transform:
        uppercase;

}


.lab-dot {

    width:
        7px;

    height:
        7px;

    border-radius:
        50%;

    background:
        #818cf8;

    box-shadow:
        0 0 12px
        rgba(129,140,248,0.8);

}


.lab-header h1 {

    margin:
        0;

    font-size:
        clamp(
            2.2rem,
            7vw,
            4rem
        );

    line-height:
        1.05;

    letter-spacing:
        -0.055em;

    font-weight:
        900;

}


.lab-header h1 span {

    display:
        block;

    color:
        #818cf8;

}


.lab-header p {

    margin:
        18px auto 0;

    max-width:
        600px;

    color:
        #94a3b8;

    font-size:
        14px;

    line-height:
        1.7;

}


/* =========================================================
   CATÁLOGO DE HERRAMIENTAS
   ========================================================= */

.herramientas-grid {

    display:
        grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0,1fr)
        );

    gap:
        12px;

    max-width:
        900px;

    margin:
        0 auto 30px;

}


.herramienta-card {

    position:
        relative;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        flex-start;

    min-height:
        145px;

    padding:
        20px;

    text-align:
        left;

    border:
        1px solid
        rgba(255,255,255,0.07);

    border-radius:
        22px;

    background:

        linear-gradient(
            145deg,
            rgba(30,41,59,0.68),
            rgba(15,23,42,0.48)
        );

    color:
        white;

    cursor:
        pointer;

    transition:
        all 180ms ease;

}


.herramienta-card:hover {

    transform:
        translateY(-3px);

    border-color:
        rgba(129,140,248,0.25);

    background:

        linear-gradient(
            145deg,
            rgba(49,46,129,0.20),
            rgba(15,23,42,0.55)
        );

}


.herramienta-card.activa {

    border-color:
        rgba(129,140,248,0.40);

    background:

        linear-gradient(
            145deg,
            rgba(99,102,241,0.18),
            rgba(15,23,42,0.60)
        );

    box-shadow:
        0 0 35px
        rgba(99,102,241,0.08);

}


.herramienta-card:disabled {

    cursor:
        default;

    opacity:
        0.45;

    filter:
        saturate(0.4);

}


.herramienta-card:disabled:hover {

    transform:
        none;

    border-color:
        rgba(255,255,255,0.07);

    background:

        linear-gradient(
            145deg,
            rgba(30,41,59,0.68),
            rgba(15,23,42,0.48)
        );

}


.herramienta-card-badge {

    position:
        absolute;

    top:
        12px;

    right:
        12px;

    font-size:
        9px;

    font-weight:
        800;

    letter-spacing:
        0.05em;

    text-transform:
        uppercase;

    color:
        var(--lab-muted);

    background:
        rgba(148,163,184,0.12);

    border:
        1px solid rgba(148,163,184,0.2);

    padding:
        3px 8px;

    border-radius:
        999px;

}


.herramienta-icono {

    font-size:
        28px;

    margin-bottom:
        13px;

}


.herramienta-nombre {

    font-size:
        15px;

    font-weight:
        800;

    letter-spacing:
        -0.02em;

}


.herramienta-descripcion {

    margin-top:
        6px;

    color:
        #64748b;

    font-size:
        11px;

    line-height:
        1.5;

}


/* =========================================================
   PANEL
   ========================================================= */

#labPanel {

    width:
        100%;

    max-width:
        900px;

    margin:
        0 auto;

}


/* =========================================================
   SEPARADOR
   ========================================================= */

.panel-separador {

    display:
        flex;

    align-items:
        center;

    gap:
        12px;

    margin:
        10px 0 25px;

}


.panel-separador::before,
.panel-separador::after {

    content:
        "";

    flex:
        1;

    height:
        1px;

    background:
        rgba(255,255,255,0.06);

}


.panel-separador span {

    color:
        #475569;

    font-size:
        9px;

    font-weight:
        800;

    letter-spacing:
        0.18em;

    text-transform:
        uppercase;

}


/* =========================================================
   NAVEGACIÓN INFERIOR
   ========================================================= */

.bottom-nav {

    position:
        fixed;

    z-index:
        20;

    left:
        50%;

    bottom:
        18px;

    transform:
        translateX(-50%);

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        8px;

    width:
        min(
            calc(100% - 28px),
            430px
        );

    padding:
        8px;

    border:
        1px solid
        rgba(255,255,255,0.08);

    border-radius:
        20px;

    background:
        rgba(5,8,22,0.82);

    backdrop-filter:
        blur(20px);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,0.45);

}


.nav-item {

    flex:
        1;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    gap:
        3px;

    min-height:
        48px;

    border-radius:
        14px;

    color:
        #64748b;

    text-decoration:
        none;

    font-size:
        10px;

    font-weight:
        700;

    transition:
        all 180ms ease;

}


.nav-item:hover {

    color:
        #c7d2fe;

    background:
        rgba(99,102,241,0.08);

}


.nav-item.active {

    color:
        #c7d2fe;

    background:
        rgba(99,102,241,0.14);

}


.nav-icon {

    font-size:
        17px;

}

/* ============================================================
   HERRAMIENTA — PIANO
   ============================================================ */

.herramienta-header {

    display: flex;
    align-items: flex-start;
    gap: 20px;

    margin-bottom: 30px;

}


.herramienta-titulo {

    display: flex;
    align-items: center;
    gap: 12px;

}


.herramienta-titulo span {

    font-size: 32px;

}


.herramienta-titulo h2 {

    margin: 0;

}


.boton-volver {

    border: 1px solid rgba(255,255,255,.12);

    background: rgba(255,255,255,.05);

    color: inherit;

    padding: 9px 14px;

    border-radius: 10px;

    cursor: pointer;

    transition: .2s ease;

}


.boton-volver:hover {

    background: rgba(255,255,255,.1);

}


/* ============================================================
   CONTENEDOR
   ============================================================ */

.piano-herramienta {

    width: 100%;

}


/* ============================================================
   PIANO
   ============================================================ */

.piano-wrapper {

    width: 100%;

    padding: 30px 12px 20px;

}


.piano {

    position: relative;

    display: flex;

    justify-content: center;

    width: 100%;

    max-width: 600px;

    height: 240px;

    margin: 0 auto;

    gap: 3px;

    /* Evita que el navegador use este gesto para hacer
       scroll de la página mientras se toca una tecla:
       clave para que no se "pierdan" pointerup/pointercancel
       en mobile. */
    touch-action: none;

}


/* ============================================================
   TECLAS BLANCAS
   ============================================================ */

.tecla-blanca {

    position: relative;

    /* Las 8 teclas blancas se reparten el ancho disponible
       en partes iguales, así siempre entran todas en
       pantalla, sea cual sea el tamaño del celular. */
    flex: 1 1 0;

    min-width: 0;

    height: 100%;

    background: linear-gradient(
        to bottom,
        #ffffff,
        #e5e7eb
    );

    border: 1px solid #9ca3af;

    border-radius: 0 0 8px 8px;

    box-shadow:
        0 5px 8px rgba(0,0,0,.25);

    cursor: pointer;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    align-items: center;

    padding-bottom: 15px;

    color: #111827;

    user-select: none;

    touch-action: none;

    transition:
        transform .05s ease,
        background .1s ease;

}


/* ============================================================
   TECLA BLANCA ACTIVA
   ============================================================ */

.tecla-blanca.activa {

    background: linear-gradient(
        to bottom,
        #c7d2fe,
        #818cf8
    );

    transform: translateY(4px);

}


/* ============================================================
   NOMBRE
   ============================================================ */

.tecla-nombre {

    font-weight: 700;

    font-size: 14px;

}


.tecla-computadora {

    font-size: 11px;

    margin-top: 5px;

    opacity: .5;

}


/* ============================================================
   TECLAS NEGRAS
   ============================================================ */

.tecla-negra {

    position: absolute;

    z-index: 5;

    top: 0;

    /* Porcentajes en vez de píxeles fijos: la tecla negra
       se resuelve contra el tamaño de la blanca (que es
       flexible), así que escala junto con ella en
       cualquier ancho de pantalla. */
    right: -29%;

    width: 58%;

    height: 62%;

    background: linear-gradient(
        to bottom,
        #111827,
        #030712
    );

    border-radius: 0 0 6px 6px;

    box-shadow:
        0 6px 10px rgba(0,0,0,.45);

    color: white;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    align-items: center;

    padding-bottom: 10px;

    cursor: pointer;

    user-select: none;

    touch-action: none;

}


.tecla-negra.activa {

    background: linear-gradient(
        to bottom,
        #6366f1,
        #4338ca
    );

    transform: translateY(3px);

}


.tecla-negra span {

    font-size: 10px;

    font-weight: 700;

}


.tecla-negra small {

    font-size: 9px;

    opacity: .6;

    margin-top: 3px;

}


/* ============================================================
   INFORMACIÓN
   ============================================================ */

.informacion-musical {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );

    gap: 15px;

    margin-top: 20px;

}


.nota-actual,
.acorde-actual {

    padding: 18px;

    border-radius: 14px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid rgba(255,255,255,.08);

}


.nota-actual span,
.armonia-label {

    display: block;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: .08em;

    opacity: .5;

    margin-bottom: 6px;

}


.nota-actual strong,
.acorde-actual strong {

    font-size: 24px;

}


/* ============================================================
   VISUALIZADOR
   ============================================================ */

#visualizadorPiano {

    position: relative;

    height: 180px;

    margin-top: 20px;

    border-radius: 18px;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(99,102,241,.18),
            rgba(0,0,0,.15) 60%
        );

    border:
        1px solid rgba(255,255,255,.08);

    transition:
        box-shadow .2s ease;

}


#visualizadorPiano.activo {

    box-shadow:
        0 0 35px rgba(99,102,241,.15);

}


#visualizadorPiano .visualizador-centro {

    position: absolute;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

}


#visualizadorPiano .visualizador-valor {

    font-size: 14px;

    text-transform: uppercase;

    letter-spacing: .12em;

    opacity: .6;

}


/* ============================================================
   SONIDOS ACTIVOS
   ============================================================ */

.sonidos-activos {

    margin-top: 15px;

}


.acorde-notas {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 10px;

}


.nota-chip {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding: 7px 11px;

    border-radius: 999px;

    background:
        rgba(99,102,241,.16);

    border:
        1px solid rgba(99,102,241,.3);

    font-size: 13px;

    font-weight: 700;

}


/* ============================================================
   MOBILE
   ============================================================ */

@media (
    max-width: 700px
) {

    .herramienta-header {

        flex-direction: column;

    }


    .informacion-musical {

        grid-template-columns:
            1fr;

    }


    .piano-wrapper {

        padding: 24px 8px 16px;

    }


    .piano {

        height: 175px;

    }


    .tecla-blanca {

        padding-bottom: 8px;

    }


    .tecla-nombre {

        font-size: 11px;

    }


    .tecla-computadora {

        /* En mobile no hay teclado físico: esa letra
           de referencia solo ocupa espacio y confunde. */
        display: none;

    }


    .tecla-negra span {

        font-size: 8px;

    }


    .tecla-negra small {

        display: none;

    }

}

/* ============================================================
   ESCALA VERTICAL DEL PIANO
   ============================================================ */

.visualizador {
    position: relative;
    overflow: hidden;
}


.escala-altura {
    position: absolute;

    left: 0;
    top: 0;
    bottom: 0;

    width: 52px;

    pointer-events: none;

    z-index: 10;
}


.escala-altura span {
    position: absolute;

    left: 14px;

    transform:
        translateY(-50%);

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 0.04em;

    opacity: 0.55;

    white-space: nowrap;
}


.onda-canvas {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 4;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (
    max-width: 760px
) {

    .herramientas-grid {

        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );

    }

}


@media (
    max-width: 500px
) {

    .app {

        padding:
            28px 14px 30px;

    }


    .lab-header {

        margin-top:
            5px;

        margin-bottom:
            25px;

    }


    .lab-header h1 {

        font-size:
            2.25rem;

    }


    .herramientas-grid {

        gap:
            8px;

    }


    .herramienta-card {

        min-height:
            125px;

        padding:
            16px;

    }


    .herramienta-icono {

        font-size:
            24px;

    }


    .herramienta-nombre {

        font-size:
            13px;

    }


    .herramienta-descripcion {

        font-size:
            10px;

    }

}


/* =========================================================
   REDUCIR MOVIMIENTO
   ========================================================= */

@media (
    prefers-reduced-motion: reduce
) {

    * {

        animation-duration:
            0.01ms !important;

        transition-duration:
            0.01ms !important;

    }

}

</style>

</head>


<body>


<div class="ambient ambient-one"></div>

<div class="ambient ambient-two"></div>


<div class="app">


<header class="lab-header">


<div class="lab-label">

<span class="lab-dot"></span>

Laboratorio

</div>


<h1>

Explorá la música.

<span>A tu manera.</span>

</h1>


<p>

Una caja de herramientas para tocar,
escuchar, experimentar y entender la música.

</p>


</header>



<!-- =====================================================
     CATÁLOGO
     ===================================================== -->

<section
    id="herramientasGrid"
    class="herramientas-grid"
>


<button
    class="herramienta-card activa"
    data-herramienta="piano"
>

    <span class="herramienta-icono">
        🎹
    </span>

    <span class="herramienta-nombre">
        Piano
    </span>

    <span class="herramienta-descripcion">
        Tocá con el mouse, el dedo o tu teclado y mirá qué acorde estás formando.
    </span>

</button>



<button
    class="herramienta-card"
    data-herramienta="metronomo"
>

    <span class="herramienta-icono">
        ⏱️
    </span>

    <span class="herramienta-nombre">
        Metrónomo
    </span>

    <span class="herramienta-descripcion">
        Un pulso preciso al milisegundo, hasta en compases compuestos e irregulares.
    </span>

</button>



<button
    class="herramienta-card"
    data-herramienta="acordes"
>

    <span class="herramienta-icono">
        🎼
    </span>

    <span class="herramienta-nombre">
        Constructor de Acordes
    </span>

    <span class="herramienta-descripcion">
        Armá acordes nota por nota y descubrí qué estructura armónica forman.
    </span>

</button>



<button
    class="herramienta-card"
    data-herramienta="diccionario"
>

    <span class="herramienta-icono">
        📖
    </span>

    <span class="herramienta-nombre">
        Diccionario de Acordes
    </span>

    <span class="herramienta-descripcion">
        Buscá cualquier acorde y mirá sus notas en el piano y en la guitarra.
    </span>

</button>



<button
    class="herramienta-card"
    data-herramienta="intervalos"
>

    <span class="herramienta-icono">
        👂
    </span>

    <span class="herramienta-nombre">
        Entrenador de Intervalos
    </span>

    <span class="herramienta-descripcion">
        Entrená tu oído reconociendo distancias entre notas.
    </span>

</button>



<button
    class="herramienta-card"
    data-herramienta="afinador"
   
>

    <span class="herramienta-card-badge">
        Afiná tu instrumento
    </span>

    <span class="herramienta-icono">
        🎧
    </span>

    <span class="herramienta-nombre">
        Afinador
    </span>

    <span class="herramienta-descripcion">
        Afiná tu instrumento en tiempo real con el micrófono.
    </span>

</button>



<button
    class="herramienta-card"
    data-herramienta="escalas"
    
>

    <span class="herramienta-card-badge">
        
    </span>

    <span class="herramienta-icono">
        🎵
    </span>

    <span class="herramienta-nombre">
        Escalas
    </span>

    <span class="herramienta-descripcion">
        Explorá escalas y modos, y escuchá cómo suena cada uno.
    </span>

</button>


</section>



<div class="panel-separador">

    <span>
        Herramienta activa
    </span>

</div>

<body class="bg-slate-900 text-white min-h-screen pb-24">

<div class="max-w-xl mx-auto p-6">

<h1
id="titulo"
class="text-3xl font-bold text-indigo-400 mb-8">
</h1>


<div
id="contenido"
class="space-y-4">
</div>


</div>


<script>

const id = new URLSearchParams(location.search).get("id");


const mision =
obtenerTodasLasMisiones().find(
m => m.id === id
);

const mundo = Object.values(DB_MUNDOS).find(
m => m.misiones.some(
mis => mis.id === id
)
);


if(!mision){

    console.error("Misión no encontrada:", id);

    location.href="index.html";

}

const motor = new Motor(mision);



function terminarMision(){

    completarMision(mision.id);

    agregarXP(
    mision.xp || 50
    );


    if(mision.id.startsWith("boss")){

        completarMundo(mundo.id);

    }


    const misiones =
    mundo.misiones;


    const posicion =
    misiones.findIndex(
        m=>m.id===mision.id
    );


    let siguiente =
    misiones[posicion+1];


    // Si terminó el jefe del mundo
    if(mision.id.startsWith("boss")){

        siguiente = null;

    }


    const cont =
    document.getElementById("contenido");


    cont.innerHTML = `

        <div class="text-center space-y-6">

            <div class="text-6xl">
                ⭐
            </div>

            <h2 class="text-2xl font-bold text-indigo-400">
                ¡Misión completada!
            </h2>

            <p class="text-emerald-400 text-2xl font-bold">
                +${mision.xp || 50} XP
            </p>

            <p class="text-slate-300">
                Nivel ${obtenerNivel()}
            </p>


            ${
                siguiente
                ?
                `
                <p class="text-slate-300">
                    Nuevo desafío desbloqueado:
                </p>

                <p class="font-bold">
                    ${siguiente.titulo}
                </p>


                <button
                onclick="location.href='mision.html?id=${siguiente.id}'"
                class="w-full p-4 rounded-xl bg-indigo-600">

                Continuar

                </button>
                `
                :
                `
                <p>
                🏆 Completaste este mundo.
                </p>

                <p class="text-indigo-300">
                Un nuevo camino está disponible.
                </p>


                <button
                onclick="location.href='mundo-completado.html?id=${mundo.id}'"
                class="w-full p-4 rounded-xl bg-indigo-600">

                Continuar aventura

                </button>
                `
            }

        </div>

    `;

}


document.getElementById("titulo").innerText =
mision.titulo;

const barra =
renderProgreso(
    mision,
    mundo
);


document
.getElementById("titulo")
.insertAdjacentElement(
    "beforebegin",
    barra
);



render();



function render(){


const paso = motor.paso;


if(!paso){

    terminarMision();

    return;

}


const cont = document.getElementById("contenido");


cont.innerHTML = "";



// Buscamos el componente correspondiente

const componente = COMPONENTES[paso.tipo];



if(componente){


    componente(
        paso,
        cont,
        motor,
        render,
        mision
    );


}else{


    console.error(
        "No existe componente para:",
        paso.tipo
    );


}



}



</script>

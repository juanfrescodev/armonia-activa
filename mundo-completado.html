<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mundo completado</title>


<script src="https://cdn.tailwindcss.com"></script>


<script src="data/misiones.js"></script>


</head>


<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center">


<div class="max-w-md p-8 text-center">


<div class="text-6xl mb-6">
🏆
</div>



<h1 class="text-3xl font-bold text-indigo-400 mb-4">

Mundo completado

</h1>



<h2
id="tituloMundo"
class="text-xl font-bold mb-6">

</h2>



<p
id="descripcionMundo"
class="text-slate-300 mb-8">

</p>



<div
id="habilidades"
class="bg-slate-800 rounded-2xl p-5 text-left space-y-3 mb-8">

</div>



<p class="text-indigo-300 font-bold mb-6">

Un nuevo camino está disponible...

</p>



<a href="index.html"
class="block bg-indigo-600 rounded-xl p-4 font-bold">

Continuar aventura

</a>



</div>





<script>


const idMundo =

new URLSearchParams(location.search)

.get("id");



const mundo =

DB_MUNDOS[idMundo];



if(!mundo){


console.error(
"No existe el mundo:",
idMundo
);


document.getElementById("tituloMundo")
.innerText =
"Error: mundo no encontrado";


}
else{


document
.getElementById("tituloMundo")
.innerText =

"🌎 " + mundo.titulo;



document
.getElementById("descripcionMundo")
.innerText =

mundo.descripcion;



const habilidades =

document.getElementById("habilidades");



if(mundo.habilidades){


habilidades.innerHTML =


mundo.habilidades

.map(

habilidad =>

`

<p>
🎵 ${habilidad}
</p>

`

)

.join("");



}



}



</script>


</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perfil - Armonía Activa</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="data/misiones.js"></script>
<script src="js/progreso.js"></script>

</head>

<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-[#0a0f1c] to-black text-white min-h-screen pb-24">

<div class="max-w-md mx-auto p-6 space-y-6">

<h1 class="text-3xl font-bold text-indigo-400 text-center">

👤 Perfil

</h1>



<!-- JUGADOR -->

<div class="rounded-3xl bg-slate-800/50 border border-white/10 p-6 text-center">

<div class="text-6xl mb-4">

🎓

</div>

<h2 class="text-xl font-bold">

Estudiante Musical

</h2>

<p class="text-slate-400 mt-2">

Nivel <span id="nivel"></span>

</p>

</div>



<!-- EXPERIENCIA -->

<div class="rounded-3xl bg-slate-800/50 border border-white/10 p-6">

<h3 class="font-bold mb-4">

Experiencia

</h3>

<div
class="w-full h-4 rounded-full bg-slate-700 overflow-hidden">

<div
id="barraXP"
class="h-full bg-indigo-500 transition-all duration-500">

</div>

</div>

<p
id="textoXP"
class="mt-3 text-center text-slate-300">

</p>

</div>



<!-- ESTADISTICAS -->

<div class="grid grid-cols-2 gap-4">

<div class="rounded-2xl bg-slate-800/50 border border-white/10 p-4 text-center">

<div class="text-3xl">

🌎

</div>

<p class="text-slate-400 text-sm mt-2">

Mundos

</p>

<p
id="mundos"
class="text-2xl font-bold text-indigo-400">

</p>

</div>



<div class="rounded-2xl bg-slate-800/50 border border-white/10 p-4 text-center">

<div class="text-3xl">

⭐

</div>

<p class="text-slate-400 text-sm mt-2">

Misiones

</p>

<p
id="misiones"
class="text-2xl font-bold text-indigo-400">

</p>

</div>

</div>



<!-- PROXIMO MUNDO -->

<div class="rounded-3xl bg-slate-800/50 border border-white/10 p-6">

<h3 class="font-bold mb-4">

🎯 Próximo objetivo

</h3>

<p
id="objetivoTitulo"
class="font-bold text-indigo-300">

</p>

<p
id="objetivoDescripcion"
class="text-slate-400 mt-2">

</p>

</div>



<!-- LOGROS -->

<div class="rounded-3xl bg-slate-800/50 border border-white/10 p-6">

<h3 class="font-bold mb-3">

🏆 Logros

</h3>

<p class="text-slate-400">

Próximamente...

</p>

</div>



<button

onclick="reiniciar()"

class="w-full rounded-xl border border-red-800 text-red-400 p-3 hover:bg-red-900/20">

Reiniciar progreso

</button>

</div>



<nav
class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#0a0f1c]/90 border-t border-white/10 flex justify-around py-4">

<a href="index.html">

🗺️ Ruta

</a>

<a href="lab.html">

🎹 Lab

</a>

<a href="perfil.html" class="text-indigo-400">

👤 Perfil

</a>

</nav>



<script>

const xp = obtenerXPNivel();

document.getElementById("nivel").innerText =
xp.nivel;

document.getElementById("barraXP").style.width =
xp.porcentaje + "%";

document.getElementById("textoXP").innerText =
`${Math.floor(xp.actual)} / ${xp.necesario} XP`;



const mundos =
obtenerMundosCompletados();

document.getElementById("mundos").innerText =
`${mundos.length} / ${obtenerCantidadMundos()}`;



const progreso =
obtenerProgreso();

document.getElementById("misiones").innerText =
`${progreso.length} / ${obtenerCantidadMisiones()}`;



let siguiente = null;

Object.values(DB_MUNDOS).forEach(mundo=>{

    if(
        !siguiente &&
        !mundos.includes(mundo.id)
    ){

        siguiente = mundo;

    }

});



if(siguiente){

    document.getElementById("objetivoTitulo").innerText =
    siguiente.titulo;

    document.getElementById("objetivoDescripcion").innerText =
    siguiente.descripcion;

}
else{

    document.getElementById("objetivoTitulo").innerText =
    "¡Curso completado!";

    document.getElementById("objetivoDescripcion").innerText =
    "Has completado todos los mundos disponibles.";

}



function reiniciar(){

    if(confirm("¿Seguro que querés borrar todo tu progreso?")){

        localStorage.clear();

        location.href="index.html";

    }

}

</script>

</body>
</html>
